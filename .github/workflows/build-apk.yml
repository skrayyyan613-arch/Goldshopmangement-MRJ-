name: Build Gold Shop Manager APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d project
          echo "ZIP extracted successfully"
          find project -maxdepth 2 -type f | head -50

      - name: Detect project folder
        run: |
          if [ -f "project/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=project" >> $GITHUB_ENV
          else
            DIR=$(find project -name settings.gradle.kts -type f -print -quit | xargs -r dirname)
            if [ -z "$DIR" ]; then
              echo "settings.gradle.kts not found"
              exit 1
            fi
            echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoldShopManager-debug-apk
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
